name: AI / SecCore Issue Analysis

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number in this repository
        required: true
        type: number
      target_ref:
        description: Branch, tag, or full SHA in this repository; frozen once per run
        required: true
        default: main
        type: string
      publish:
        description: Post the reviewed report and add its priority in this repository
        required: true
        default: false
        type: boolean
      router_run_id:
        description: Router run provenance; leave empty for a manual analysis
        required: false
        type: string
      router_comment_id:
        description: Trusted Router decision comment ID
        required: false
        type: string
      router_decision_id:
        description: Stable Router decision ID
        required: false
        type: string
  push:
    branches: [main, issue]
    paths:
      - .github/workflows/sec-core-issue-analysis.yml
      - .github/scripts/sec-core-issue-*
      - .github/issue-analysis/**
      - .github/workflows/issue-automation.yml
      - .github/scripts/issue-triage*

permissions:
  contents: read

concurrency:
  group: sec-core-issue-analysis-${{ inputs.issue_number || github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    if: contains(fromJSON('["1197072745","1195873793"]'), github.repository_id)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test .github/scripts/sec-core-issue-analysis.test.js .github/scripts/issue-triage.test.js .github/scripts/issue-claim.test.js

  analyze:
    needs: checks
    if: >-
      contains(fromJSON('["1197072745","1195873793"]'), github.repository_id) &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      AGENT_TIMEOUT_SECONDS: '0'
    permissions:
      contents: read
      issues: read
      actions: read
    outputs:
      artifact_name: sec-core-issue-${{ steps.snapshot.outputs.issue_number }}-${{ github.run_id }}-${{ github.run_attempt }}
      skip_analysis: ${{ steps.snapshot.outputs.skip_analysis }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: workflow
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set the analysis directory
        run: echo "ANALYSIS_ROOT=$RUNNER_TEMP/sec-core-issue-analysis" >> "$GITHUB_ENV"

      - name: Freeze the issue, rules, and target commit
        id: snapshot
        uses: actions/github-script@v7
        env:
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
          INPUT_TARGET_REF: ${{ inputs.target_ref }}
          INPUT_ROUTER_RUN_ID: ${{ inputs.router_run_id }}
          INPUT_ROUTER_COMMENT_ID: ${{ inputs.router_comment_id }}
          INPUT_ROUTER_DECISION_ID: ${{ inputs.router_decision_id }}
          PUBLISH_ALLOWED: ${{ inputs.publish }}
        with:
          script: |
            const analysis = require(`${process.env.GITHUB_WORKSPACE}/workflow/.github/scripts/sec-core-issue-analysis.js`);
            await analysis.prepare({ github, context, core, env: process.env });

      - name: Check model credential availability
        if: steps.snapshot.outputs.skip_analysis != 'true'
        env:
          QODER_PERSONAL_ACCESS_TOKEN: ${{ secrets.QODER_PERSONAL_ACCESS_TOKEN }}
        run: |
          if [ -z "$QODER_PERSONAL_ACCESS_TOKEN" ]; then
            echo 'Configure QODER_PERSONAL_ACCESS_TOKEN in this repository Actions secrets.' >&2
            exit 1
          fi

      - name: Check out the frozen source
        if: steps.snapshot.outputs.skip_analysis != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.snapshot.outputs.target_sha }}
          path: target-source
          persist-credentials: false

      - name: Prepare the read-only source snapshot
        if: steps.snapshot.outputs.skip_analysis != 'true'
        run: |
          node workflow/.github/scripts/sec-core-issue-analysis.js stage \
            "$ANALYSIS_ROOT" "$GITHUB_WORKSPACE/target-source"

      - name: Build the pinned Qoder runtime
        if: steps.snapshot.outputs.skip_analysis != 'true'
        timeout-minutes: 5
        run: docker build --tag sec-core-issue-analysis:local workflow/.github/issue-analysis

      - name: Analyze claims and propose priority
        if: steps.snapshot.outputs.skip_analysis != 'true'
        env:
          QODER_PERSONAL_ACCESS_TOKEN: ${{ secrets.QODER_PERSONAL_ACCESS_TOKEN }}
        run: |
          node workflow/.github/scripts/sec-core-issue-analysis.js analysis \
            "$ANALYSIS_ROOT" workflow/.github/issue-analysis/sec-core.md

      - name: Verify an approved functional PoC in isolation
        if: steps.snapshot.outputs.skip_analysis != 'true'
        timeout-minutes: 10
        run: node workflow/.github/scripts/sec-core-issue-poc.js "$ANALYSIS_ROOT"

      - name: Review exceptions against the source
        if: steps.snapshot.outputs.skip_analysis != 'true'
        env:
          QODER_PERSONAL_ACCESS_TOKEN: ${{ secrets.QODER_PERSONAL_ACCESS_TOKEN }}
        run: |
          node workflow/.github/scripts/sec-core-issue-analysis.js review-if-needed \
            "$ANALYSIS_ROOT" workflow/.github/issue-analysis/sec-core.md

      - name: Revise once when review requests changes
        if: steps.snapshot.outputs.skip_analysis != 'true'
        env:
          QODER_PERSONAL_ACCESS_TOKEN: ${{ secrets.QODER_PERSONAL_ACCESS_TOKEN }}
        run: |
          node workflow/.github/scripts/sec-core-issue-analysis.js revise \
            "$ANALYSIS_ROOT" workflow/.github/issue-analysis/sec-core.md

      - name: Produce the report and writeback preview
        if: steps.snapshot.outputs.skip_analysis != 'true'
        run: |
          node workflow/.github/scripts/sec-core-issue-analysis.js finish "$ANALYSIS_ROOT"
          cat "$ANALYSIS_ROOT/output/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence and phase records
        if: always() && steps.snapshot.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: sec-core-issue-${{ steps.snapshot.outputs.issue_number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ANALYSIS_ROOT }}/output/
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: analyze
    if: >-
      needs.analyze.outputs.skip_analysis != 'true' && inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.analyze.outputs.artifact_name }}
          path: ${{ runner.temp }}/sec-core-issue-analysis/output
      - name: Publish the validated decision and verify the issue
        uses: actions/github-script@v7
        env:
          ANALYSIS_ROOT: ${{ runner.temp }}/sec-core-issue-analysis
          PUBLISH_ALLOWED: 'true'
        with:
          script: |
            const analysis = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/sec-core-issue-analysis.js`);
            await analysis.publish({ github, context, core, env: process.env });
      - name: Upload publication audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.analyze.outputs.artifact_name }}-publication
          path: ${{ runner.temp }}/sec-core-issue-analysis/output/
          retention-days: 7
          if-no-files-found: error
