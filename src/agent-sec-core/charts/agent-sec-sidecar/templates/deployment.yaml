{{- include "agent-sec-sidecar.validateValues" . }}
{{- $dataAccessConfig := include "agent-sec-sidecar.effectiveDataAccessModes" . | fromJson }}
{{- $dataAccessModes := get $dataAccessConfig "accessModes" }}
{{- $skillfs := .Values.skillfs | default dict }}
{{- $skillfsEnabled := get $skillfs "enabled" | default false }}
{{- $persistentRoot := trimSuffix "/" .Values.persistence.mountPath }}
{{- $xdgConfigHome := ternary (printf "%s/.config" $persistentRoot) "/config" .Values.persistence.enabled }}
{{- $xdgDataHome := ternary (printf "%s/.local/share" $persistentRoot) "/data/xdg" .Values.persistence.enabled }}
{{- $skillLedgerConfigDir := printf "%s/agent-sec/skill-ledger" $xdgConfigHome }}
{{- $skillLedgerDataDir := printf "%s/agent-sec/skill-ledger" $xdgDataHome }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-sec-sidecar.fullname" . }}
  labels:
    {{- include "agent-sec-sidecar.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- if eq .Values.runtime.volume.type "persistentVolumeClaim" }}
    type: Recreate
    rollingUpdate: null
    {{- else }}
    type: RollingUpdate
    rollingUpdate:
      {{- if and .Values.persistence.enabled (not (has "ReadWriteMany" $dataAccessModes)) }}
      maxSurge: 0
      maxUnavailable: 1
      {{- else }}
      maxSurge: 1
      maxUnavailable: 0
      {{- end }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "agent-sec-sidecar.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agent-sec-sidecar.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $skillfsEnabled }}
      shareProcessNamespace: true
      initContainers:
        - name: prepare
          image: {{ include "agent-sec-sidecar.skillfsPrepareImage" . | quote }}
          imagePullPolicy: {{ .Values.skillfs.prepare.image.pullPolicy }}
          command:
            - /bin/bash
            - -euo
            - pipefail
            - -c
          args:
            - |
              install -d -m 0750 /var/lib/skillfs/source
              install -d -m 0750 /var/lib/skillfs/shared/mount
              install -d -m 0700 /run/anolisa/skillfs
              install -d -m 0700 {{ $skillLedgerConfigDir | quote }}
              install -d -m 0700 {{ $skillLedgerDataDir | quote }} /data/diagnostics
              chmod 0700 /run/anolisa/skillfs
              chmod 0700 {{ $skillLedgerConfigDir | quote }} {{ $skillLedgerDataDir | quote }} /data/diagnostics
              printf '%s\n' \
                'root:x:0:0:root:/root:/bin/bash' \
                'skillfs:x:10001:10001:SkillFS runtime:/nonexistent:/usr/sbin/nologin' \
                > /identity/passwd
              printf '%s\n' \
                'root:x:0:' \
                'skillfs:x:10001:' \
                > /identity/group
              chmod 0644 /identity/passwd /identity/group
              printf '%s\n' \
                '{' \
                '  "activationPolicy": "pass_warn_only",' \
                '  "enableDefaultSkillDirs": false,' \
                '  "managedSkillDirs": []' \
                '}' \
                > {{ printf "%s/config.json" $skillLedgerConfigDir | quote }}
              chmod 0600 {{ printf "%s/config.json" $skillLedgerConfigDir | quote }}
              head -c 32 /dev/urandom > /private-auth/control.key
              head -c 32 /dev/urandom > /private-auth/notify.key
              chmod 0400 /private-auth/control.key /private-auth/notify.key
              chown -R 10001:10001 \
                /var/lib/skillfs/source \
                /var/lib/skillfs/shared/mount \
                /run/anolisa/skillfs \
                {{ $skillLedgerConfigDir | quote }} \
                {{ $skillLedgerDataDir | quote }} \
                /data/diagnostics
              chown 10001:10001 /private-auth/control.key /private-auth/notify.key
          securityContext:
            {{- toYaml .Values.skillfs.prepare.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.skillfs.prepare.resources | nindent 12 }}
          volumeMounts:
            - name: skillfs-source
              mountPath: /var/lib/skillfs/source
            - name: skillfs-shared
              mountPath: /var/lib/skillfs/shared
            - name: runtime
              mountPath: /run/anolisa
            - name: skillfs-auth
              mountPath: /private-auth
            - name: skillfs-config
              mountPath: /config
            - name: skillfs-data
              mountPath: /data
            - name: skillfs-identity
              mountPath: /identity
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath | quote }}
            {{- end }}
        - name: skillfs
          restartPolicy: Always
          image: {{ include "agent-sec-sidecar.skillfsImage" . | quote }}
          imagePullPolicy: {{ .Values.skillfs.image.pullPolicy }}
          env:
            - name: SKILLFS_SOURCE
              value: /var/lib/skillfs/source
            - name: SKILLFS_MOUNTPOINT
              value: /var/lib/skillfs/shared/mount
            - name: SKILLFS_DISCOVER_ROOT
              value: /var/lib/skillfs/shared/mount/skills
            - name: SKILLFS_EXTRA_ARGS
              value: >-
                --security --activation-mode file --activation-reload-mode poll
                --notify-socket {{ include "agent-sec-sidecar.socketPath" . }}
                --notify-auth-key-file /run/anolisa/auth/notify.key
                --control-socket {{ printf "%s/skillfs/control.sock" (trimSuffix "/" .Values.runtime.mountPath) }}
                --trusted-peer-key-file /run/anolisa/auth/control.key
            - name: RUST_LOG
              value: info
          securityContext:
            {{- toYaml .Values.skillfs.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.skillfs.resources | nindent 12 }}
          startupProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - |
                  awk -v target="$SKILLFS_MOUNTPOINT" '
                    $5 == target {
                      for (i = 7; i <= NF; i++) {
                        if ($i == "-" && $(i + 1) ~ /^fuse/) { found = 1 }
                      }
                    }
                    END { exit(found ? 0 : 1) }
                  ' /proc/self/mountinfo
            periodSeconds: {{ .Values.skillfs.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.skillfs.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.skillfs.startupProbe.failureThreshold }}
          volumeMounts:
            - name: skillfs-source
              mountPath: /var/lib/skillfs/source
            - name: skillfs-shared
              mountPath: /var/lib/skillfs/shared
              mountPropagation: Bidirectional
            - name: runtime
              mountPath: {{ .Values.runtime.mountPath | quote }}
            - name: skillfs-auth
              mountPath: /run/anolisa/auth
              readOnly: true
            - name: fuse-device
              mountPath: /dev/fuse
            - name: skillfs-identity
              mountPath: /etc/passwd
              subPath: passwd
              readOnly: true
            - name: skillfs-identity
              mountPath: /etc/group
              subPath: group
              readOnly: true
      {{- end }}
      containers:
        - name: agent-sec-cli
          image: "{{ .Values.cli.image.repository }}:{{ .Values.cli.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.cli.image.pullPolicy }}
          stdin: {{ .Values.cli.stdin }}
          tty: {{ .Values.cli.tty }}
          {{- with .Values.cli.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.cli.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: AGENT_SEC_DAEMON_SOCKET
              value: {{ include "agent-sec-sidecar.socketPath" . | quote }}
            - name: AGENT_SEC_MODEL_SERVICE_BACKEND
              value: {{ .Values.modelService.backend | quote }}
            - name: AGENT_SEC_MODEL_SERVICE_BASE_URL
              value: {{ .Values.modelService.baseUrl | quote }}
            - name: AGENT_SEC_MODEL_SERVICE_TIMEOUT
              value: {{ .Values.modelService.timeoutSeconds | quote }}
            - name: PROMPT_SCANNER_L2_MODEL
              value: {{ .Values.ollama.model | quote }}
            {{- if .Values.persistence.enabled }}
            - name: AGENT_SEC_DATA_DIR
              value: {{ include "agent-sec-sidecar.dataPath" . | quote }}
            {{- if .Values.cli.qoder.persistentPaths.enabled }}
            - name: HOME
              value: {{ .Values.persistence.mountPath | quote }}
            - name: QODER_CONFIG_DIR
              value: {{ include "agent-sec-sidecar.qoderConfigPath" . | quote }}
            - name: QODER_WORKING_DIR
              value: {{ include "agent-sec-sidecar.qoderWorkspacePath" . | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.cli.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.cli.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.cli.resources | nindent 12 }}
          volumeMounts:
            - name: runtime
              mountPath: {{ .Values.runtime.mountPath | quote }}
            {{- if $skillfsEnabled }}
            - name: skillfs-shared
              mountPath: /var/lib/skillfs/shared
              mountPropagation: HostToContainer
            {{- end }}
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath | quote }}
            {{- end }}
        - name: agent-sec-daemon
          image: "{{ .Values.daemon.image.repository }}:{{ .Values.daemon.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.daemon.image.pullPolicy }}
          {{- with .Values.daemon.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.daemon.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: AGENT_SEC_DAEMON_SOCKET
              value: {{ include "agent-sec-sidecar.socketPath" . | quote }}
            {{- if .Values.persistence.enabled }}
            - name: AGENT_SEC_DATA_DIR
              value: {{ include "agent-sec-sidecar.dataPath" . | quote }}
            {{- else if $skillfsEnabled }}
            - name: AGENT_SEC_DATA_DIR
              value: /data/diagnostics
            {{- end }}
            {{- if $skillfsEnabled }}
            - name: AGENT_SEC_SKILLFS_CONTROL_SOCKET
              value: {{ printf "%s/skillfs/control.sock" (trimSuffix "/" .Values.runtime.mountPath) | quote }}
            - name: AGENT_SEC_SKILLFS_CONTROL_AUTH_KEY_FILE
              value: /run/anolisa/auth/control.key
            - name: AGENT_SEC_SKILLFS_NOTIFY_AUTH_KEY_FILE
              value: /run/anolisa/auth/notify.key
            {{- end }}
            {{- if .Values.persistence.enabled }}
            - name: HOME
              value: {{ .Values.persistence.mountPath | quote }}
            - name: XDG_CACHE_HOME
              value: {{ printf "%s/cache" (trimSuffix "/" .Values.persistence.mountPath) | quote }}
            - name: XDG_CONFIG_HOME
              value: {{ $xdgConfigHome | quote }}
            - name: XDG_DATA_HOME
              value: {{ $xdgDataHome | quote }}
            {{- else }}
            - name: HOME
              value: /tmp/agent-sec-home
            - name: XDG_CACHE_HOME
              value: /tmp/agent-sec-cache
            {{- if $skillfsEnabled }}
            - name: XDG_CONFIG_HOME
              value: /config
            - name: XDG_DATA_HOME
              value: /data/xdg
            {{- else }}
            - name: XDG_CONFIG_HOME
              value: /tmp/agent-sec-config
            - name: XDG_DATA_HOME
              value: /tmp/agent-sec-data
            {{- end }}
            {{- end }}
            - name: AGENT_SEC_MODEL_SERVICE_BACKEND
              value: {{ .Values.modelService.backend | quote }}
            - name: AGENT_SEC_MODEL_SERVICE_BASE_URL
              value: {{ .Values.modelService.baseUrl | quote }}
            - name: AGENT_SEC_MODEL_SERVICE_TIMEOUT
              value: {{ .Values.modelService.timeoutSeconds | quote }}
            {{- with .Values.daemon.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.daemon.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.daemon.resources | nindent 12 }}
          volumeMounts:
            - name: runtime
              mountPath: {{ .Values.runtime.mountPath | quote }}
            {{- if $skillfsEnabled }}
            - name: skillfs-source
              mountPath: /var/lib/skillfs/source
            - name: skillfs-shared
              mountPath: /var/lib/skillfs/shared
              mountPropagation: HostToContainer
            - name: skillfs-auth
              mountPath: /run/anolisa/auth
              readOnly: true
            - name: skillfs-config
              mountPath: /config
              readOnly: true
            - name: skillfs-data
              mountPath: /data
            {{- end }}
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath | quote }}
            {{- end }}
          {{- if .Values.daemon.probes.startup.enabled }}
          startupProbe:
            exec:
              command:
                - /usr/local/bin/agent-sec-daemon-health
            initialDelaySeconds: {{ .Values.daemon.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.daemon.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.daemon.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.daemon.probes.startup.failureThreshold }}
          {{- end }}
          {{- if .Values.daemon.probes.readiness.enabled }}
          readinessProbe:
            exec:
              command:
                - /usr/local/bin/agent-sec-daemon-health
            initialDelaySeconds: {{ .Values.daemon.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.daemon.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.daemon.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.daemon.probes.readiness.failureThreshold }}
          {{- end }}
          {{- if .Values.daemon.probes.liveness.enabled }}
          livenessProbe:
            exec:
              command:
                - /usr/local/bin/agent-sec-daemon-health
            initialDelaySeconds: {{ .Values.daemon.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.daemon.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.daemon.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.daemon.probes.liveness.failureThreshold }}
          {{- end }}
        {{- if .Values.ollama.enabled }}
        - name: ollama
          image: "{{ .Values.ollama.image.repository }}:{{ .Values.ollama.image.tag }}"
          imagePullPolicy: {{ .Values.ollama.image.pullPolicy }}
          env:
            - name: OLLAMA_HOST
              value: {{ .Values.ollama.host | quote }}
            - name: OLLAMA_KEEP_ALIVE
              value: {{ .Values.ollama.keepAlive | quote }}
            - name: OLLAMA_FLASH_ATTENTION
              value: {{ ternary "1" "0" .Values.ollama.flashAttention | quote }}
            - name: OLLAMA_KV_CACHE_TYPE
              value: {{ .Values.ollama.kvCacheType | quote }}
            - name: OLLAMA_NUM_PARALLEL
              value: {{ .Values.ollama.numParallel | quote }}
            - name: OLLAMA_NUM_CTX
              value: {{ .Values.ollama.numCtx | quote }}
            - name: OLLAMA_MODEL
              value: {{ .Values.ollama.model | quote }}
            - name: OLLAMA_STARTUP_TIMEOUT_SECONDS
              value: {{ .Values.ollama.startupTimeoutSeconds | quote }}
            {{- if .Values.persistence.enabled }}
            - name: HOME
              value: {{ include "agent-sec-sidecar.ollamaHomePath" . | quote }}
            - name: OLLAMA_MODELS
              value: {{ include "agent-sec-sidecar.ollamaModelsPath" . | quote }}
            {{- else }}
            - name: HOME
              value: /tmp/ollama-home
            - name: OLLAMA_MODELS
              value: /tmp/ollama-models
            {{- end }}
            {{- with .Values.ollama.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.ollama.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.ollama.resources | nindent 12 }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath | quote }}
          {{- end }}
          {{- if .Values.ollama.probes.startup.enabled }}
          startupProbe:
            exec:
              command:
                - ollama
                - list
            initialDelaySeconds: {{ .Values.ollama.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.ollama.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.ollama.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.ollama.probes.startup.failureThreshold }}
          {{- end }}
          {{- if .Values.ollama.probes.readiness.enabled }}
          readinessProbe:
            exec:
              command:
                - ollama
                - show
                - {{ .Values.ollama.model | quote }}
            initialDelaySeconds: {{ .Values.ollama.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.ollama.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.ollama.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.ollama.probes.readiness.failureThreshold }}
          {{- end }}
          {{- if .Values.ollama.probes.liveness.enabled }}
          livenessProbe:
            exec:
              command:
                - ollama
                - list
            initialDelaySeconds: {{ .Values.ollama.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.ollama.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.ollama.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.ollama.probes.liveness.failureThreshold }}
          {{- end }}
        {{- end }}
      volumes:
        {{- if $skillfsEnabled }}
        - name: skillfs-source
          emptyDir: {}
        - name: skillfs-shared
          emptyDir: {}
        - name: skillfs-auth
          emptyDir:
            medium: Memory
        - name: skillfs-config
          emptyDir: {}
        - name: skillfs-data
          emptyDir: {}
        - name: skillfs-identity
          emptyDir: {}
        - name: fuse-device
          hostPath:
            path: /dev/fuse
            type: CharDevice
        {{- end }}
        - name: runtime
          {{- if eq .Values.runtime.volume.type "emptyDir" }}
          emptyDir:
            {{- with .Values.runtime.volume.emptyDir.medium }}
            medium: {{ . | quote }}
            {{- end }}
            {{- with .Values.runtime.volume.emptyDir.sizeLimit }}
            sizeLimit: {{ . | quote }}
            {{- end }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "agent-sec-sidecar.runtimeClaimName" . }}
          {{- end }}
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "agent-sec-sidecar.dataClaimName" . }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
