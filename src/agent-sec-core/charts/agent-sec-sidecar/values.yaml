replicaCount: 1

nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

modelService:
  backend: ollama
  baseUrl: http://localhost:11434
  timeoutSeconds: 30

cli:
  image:
    repository: jinli-acs-registry.cn-hangzhou.cr.aliyuncs.com/acs/agent-sec-qodercli
    tag: "warden-l2-smoke-20260824"
    pullPolicy: IfNotPresent
  # Qoder CLI is an interactive foreground TUI, so keep stdin and a TTY open.
  stdin: true
  tty: true
  command: []
  args: []
  qoder:
    persistentPaths:
      # Qoder settings, sessions, memories, and workspace data must survive Pod
      # replacement, so place them on the data PVC.
      enabled: true
      configRelativePath: qoder-config
      workspaceRelativePath: qoder-workspace
  extraEnv:
    - name: CODE_SCANNER_MODE
      value: "deny"
    - name: PROMPT_SCANNER_MODE
      value: "deny"
    - name: PROMPT_SCANNER_TIMEOUT
      value: "150"
  resources: {}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false

daemon:
  image:
    repository: jinli-acs-registry.cn-hangzhou.cr.aliyuncs.com/acs/agent-sec-daemon
    tag: "0.10.1"
    pullPolicy: IfNotPresent
  command: []
  args: []
  extraEnv: []
  resources: {}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false
  probes:
    startup:
      enabled: true
      initialDelaySeconds: 1
      periodSeconds: 2
      timeoutSeconds: 2
      failureThreshold: 30
    readiness:
      enabled: true
      initialDelaySeconds: 1
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 3
    liveness:
      enabled: true
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3

# SkillFS requires Kubernetes native sidecars, a privileged container,
# /dev/fuse, and bidirectional mount propagation.
skillfs:
  enabled: false
  image:
    repository: anolisa-registry-vpc.cn-hangzhou.cr.aliyuncs.com/anolisa-agent-sec-core-e2e/skillfs
    tag: ""
    digest: sha256:1c602790929facd6edb38927cc3094792c2730ef7751abad9d6bdd813f0dce61
    pullPolicy: IfNotPresent
  prepare:
    # The bootstrap script only needs bash and coreutils; it does not depend on
    # the daemon or SkillFS binaries.
    image:
      repository: alibaba-cloud-linux-4-registry.cn-hangzhou.cr.aliyuncs.com/alinux4/alinux4
      tag: latest
      digest: ""
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 250m
        memory: 512Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        add:
          - CHOWN
          - DAC_OVERRIDE
          - FOWNER
        drop:
          - ALL
      privileged: false
      runAsGroup: 0
      runAsNonRoot: false
      runAsUser: 0
      seccompProfile:
        type: RuntimeDefault
  resources:
    requests:
      cpu: 1
      memory: 2Gi
    limits:
      cpu: 1
      memory: 2Gi
  securityContext:
    privileged: true
    runAsGroup: 10001
    runAsNonRoot: true
    runAsUser: 10001
  startupProbe:
    periodSeconds: 2
    timeoutSeconds: 4
    failureThreshold: 150

ollama:
  enabled: true
  image:
    repository: jinli-acs-registry.cn-hangzhou.cr.aliyuncs.com/acs/agent-sec-ollama
    tag: "warden-skillfs-smoke-20260824"
    pullPolicy: IfNotPresent
  model: modelscope.cn/ANOLISA/Warden-Gen-0.6B-GGUF
  host: 127.0.0.1:11434
  keepAlive: "-1"
  # The entrypoint re-creates the local model tag with num_ctx=4096 because a
  # Modelfile parameter takes precedence over Ollama's global context setting.
  # Render OLLAMA_FLASH_ATTENTION=1 because the KV cache is quantized.
  flashAttention: true
  kvCacheType: q8_0
  numParallel: 1
  numCtx: 4096
  startupTimeoutSeconds: 60
  persistentPaths:
    homeRelativePath: ollama-home
    modelsRelativePath: ollama-models
  extraEnv: []
  resources: {}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false
  probes:
    startup:
      enabled: true
      initialDelaySeconds: 1
      periodSeconds: 2
      timeoutSeconds: 2
      failureThreshold: 30
    readiness:
      enabled: true
      initialDelaySeconds: 1
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 3
    liveness:
      enabled: true
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3

runtime:
  mountPath: /run/agent-sec
  socketRelativePath: runtime/daemon.sock
  volume:
    # emptyDir is the correct default for a Pod-scoped Unix socket. Set this
    # to persistentVolumeClaim only when a platform policy requires a PVC.
    type: emptyDir
    emptyDir:
      medium: ""
      sizeLimit: 16Mi
    persistentVolumeClaim:
      create: true
      existingClaim: ""
      storageClassName: ""
      accessModes:
        - ReadWriteOnce
      size: 1Gi
      annotations: {}

persistence:
  # CLI and daemon use <mountPath>/<dataRelativePath>/<runAsUser> as
  # AGENT_SEC_DATA_DIR. The UID level keeps data created by different runtime
  # users isolated during UID migration.
  enabled: true
  mountPath: /var/lib/agent-sec/persistent
  dataRelativePath: events
  persistentVolumeClaim:
    # existingClaim takes precedence over create. Leave it empty to let the
    # chart create a PVC, or set it to mount a pre-provisioned PVC.
    create: true
    existingClaim: ""
    storageClassName: alicloud-disk-ssd
    accessModes:
      - ReadWriteOnce
    size: 20Gi
    annotations: {}

podAnnotations:
  alibabacloud.com/pod-required-spec: "4-8Gi"
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

automountServiceAccountToken: false
terminationGracePeriodSeconds: 30

nodeSelector: {}
tolerations: []
affinity: {}
